<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial; }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    background-color: #FFFFFF;
  }
  .header-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 60px;
    background-color: #1A3A5C;
  }
  .header-title {
    position: absolute;
    top: 12px;
    left: 40px;
    font-size: 28px;
    color: #FFFFFF;
    font-weight: bold;
  }
  .content-area {
    position: absolute;
    top: 100px;
    left: 60px;
    width: 1160px;
  }
  .section-title {
    font-size: 32px;
    color: #1A3A5C;
    font-weight: bold;
    margin-bottom: 30px;
  }
  .key-point {
    position: absolute;
    top: 200px;
    left: 60px;
    width: 520px;
    height: 200px;
    background-color: #F0F6FC;
    border-radius: 8px;
  }
  .key-point-title {
    position: absolute;
    top: 220px;
    left: 90px;
    font-size: 22px;
    color: #1A3A5C;
    font-weight: bold;
  }
  .key-point-text {
    position: absolute;
    top: 260px;
    left: 90px;
    width: 460px;
    font-size: 18px;
    color: #444444;
  }
  .key-point2 {
    position: absolute;
    top: 200px;
    left: 640px;
    width: 520px;
    height: 200px;
    background-color: #FFF8F0;
    border-radius: 8px;
  }
  .key-point2-title {
    position: absolute;
    top: 220px;
    left: 670px;
    font-size: 22px;
    color: #CC6600;
    font-weight: bold;
  }
  .key-point2-text {
    position: absolute;
    top: 260px;
    left: 670px;
    width: 460px;
    font-size: 18px;
    color: #444444;
  }
  .summary-box {
    position: absolute;
    top: 460px;
    left: 60px;
    width: 1100px;
    height: 120px;
    background-color: #F5F5F5;
    border-radius: 8px;
  }
  .summary-title {
    position: absolute;
    top: 480px;
    left: 90px;
    font-size: 20px;
    color: #1A3A5C;
    font-weight: bold;
  }
  .summary-text {
    position: absolute;
    top: 515px;
    left: 90px;
    width: 1040px;
    font-size: 16px;
    color: #666666;
  }
  .page-number {
    position: absolute;
    bottom: 20px;
    right: 40px;
    font-size: 14px;
    color: #999999;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="header-bar"></div>
  <div class="header-title">项目概述</div>
  <div class="content-area">
    <div class="section-title">本季度核心成果</div>
  </div>
  <div class="key-point"></div>
  <div class="key-point-title">产品发布</div>
  <div class="key-point-text">完成 V2.0 版本发布，新增用户管理、数据分析两大核心模块，用户活跃度提升 35%。</div>
  <div class="key-point2"></div>
  <div class="key-point2-title">团队建设</div>
  <div class="key-point2-text">团队规模从 12 人扩展至 18 人，引入 2 名高级工程师，建立代码审查机制。</div>
  <div class="summary-box"></div>
  <div class="summary-title">总结</div>
  <div class="summary-text">本季度在产品迭代、团队扩张、技术架构优化三个方面均取得显著进展，为下半年目标奠定坚实基础。</div>
  <div class="page-number">2 / 3</div>
</div>
</body>
</html>
