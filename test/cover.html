<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial; }
  .slide {
    width: 1280px;
    height: 720px;
    position: relative;
    background-color: #1A3A5C;
  }
  .title-area {
    position: absolute;
    top: 200px;
    left: 100px;
    width: 1080px;
  }
  .main-title {
    font-size: 56px;
    color: #FFFFFF;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .subtitle {
    font-size: 28px;
    color: #AACCEE;
  }
  .author-info {
    position: absolute;
    bottom: 80px;
    left: 100px;
    font-size: 20px;
    color: #88AACC;
  }
  .date-info {
    position: absolute;
    bottom: 80px;
    right: 100px;
    font-size: 20px;
    color: #88AACC;
  }
  .decoration-line {
    position: absolute;
    top: 180px;
    left: 100px;
    width: 200px;
    height: 4px;
    background-color: #FF6600;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="decoration-line"></div>
  <div class="title-area">
    <div class="main-title">2026年度项目汇报</div>
    <div class="subtitle">产品研发部 · 第二季度工作总结与展望</div>
  </div>
  <div class="author-info">汇报人：张三</div>
  <div class="date-info">2026年6月</div>
</div>
</body>
</html>
