<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>情绪管理：看见逃避背后的恐惧</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial, SimHei; overflow: hidden; }
        .slide { width: 1280px; height: 720px; display: flex; flex-direction: column; }
        .page-header { height: 80px; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #A61B29; background: #FFFFFF; }
        .page-title { font-size: 28px; color: #7A1E1E; font-weight: 700; }
        .section-info { font-size: 16px; color: #8C7A66; white-space: nowrap; }
        .page-body { flex: 1; height: 590px; padding: 36px 60px; background: linear-gradient(180deg, #F8F1E3 0%, #FFFFFF 100%); display: flex; gap: 25px; }
        .panel { background: #FFFFFF; border: 1px solid #E8D8BF; border-radius: 16px; padding: 26px; height: 500px; }
        .left-panel, .right-panel { width: 430px; }
        .middle-panel { width: 300px; }
        .panel-title { font-size: 24px; font-weight: 700; color: #7A1E1E; margin-bottom: 22px; }
        .bubble { height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 19px; font-weight: 700; margin-bottom: 16px; white-space: nowrap; }
        .bubble-1 { background: #2E5E4E; }
        .bubble-2 { background: #C87941; }
        .bubble-3 { background: #C02C38; }
        .panel-desc { font-size: 16px; color: #6B4F3A; line-height: 1.7; margin-top: 20px; }
        .brain-box { width: 170px; height: 170px; border-radius: 50%; border: 3px solid #2E5E4E; margin: 20px auto 28px auto; display: flex; align-items: center; justify-content: center; background: rgba(123,97,255,0.06); }
        .brain-text { font-size: 26px; font-weight: 700; color: #2E5E4E; text-align: center; line-height: 1.3; }
        .science-text { font-size: 16px; color: #2B2B2B; line-height: 1.8; text-align: center; }
        .progress-wrap { margin-top: 26px; }
        .progress-labels { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .progress-label { font-size: 13px; color: #6B4F3A; white-space: nowrap; }
        .progress-track { width: 100%; height: 18px; background: #F3E4C8; border-radius: 9px; overflow: hidden; border: 1px solid #E8D8BF; }
        .progress-fill { width: 72%; height: 100%; background: linear-gradient(90deg, #2E5E4E 0%, #C87941 100%); }
        .training-list { margin-top: 28px; }
        .training-item { display: flex; align-items: flex-start; margin-bottom: 14px; }
        .dot { width: 22px; height: 22px; border-radius: 50%; background: #D4AF37; color: #FFFFFF; font-size: 14px; display: flex; justify-content: center; align-items: center; margin-right: 10px; flex-shrink: 0; }
        .item-text { font-size: 16px; color: #2B2B2B; line-height: 1.5; }
        .page-footer { height: 50px; padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E8D8BF; background: #FFFFFF; }
        .footer-left, .footer-right { font-size: 14px; color: #8C7A66; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="page-header"><div class="page-title">情绪管理：看见逃避背后的恐惧</div><div class="section-info">03 / 缓解焦虑与压力</div></div>
        <div class="page-body">
            <div class="panel left-panel">
                <div class="panel-title">我在害怕什么？</div>
                <div class="bubble bubble-1">害怕失败</div>
                <div class="bubble bubble-2">害怕批评</div>
                <div class="bubble bubble-3">害怕不完美</div>
                <div class="panel-desc">写下来或说出来，逃避冲动会被削弱。厘清情绪，是停止自动逃避的起点。</div>
            </div>
            <div class="panel middle-panel">
                <div class="panel-title">心理机制</div>
                <div class="brain-box"><div class="brain-text">杏仁核<br>过度激活</div></div>
                <div class="science-text">杏仁核过度激活会触发逃避行为，需要通过理性思考平复。</div>
            </div>
            <div class="panel right-panel">
                <div class="panel-title">建立“情绪肌肉”</div>
                <div class="panel-desc">对不愉快任务设定 5 分钟忍耐期，再逐步延长耐受时间。</div>
                <div class="progress-wrap">
                    <div class="progress-labels"><span class="progress-label">1分钟</span><span class="progress-label">3分钟</span><span class="progress-label">5分钟</span><span class="progress-label">更久</span></div>
                    <div class="progress-track"><div class="progress-fill"></div></div>
                </div>
                <div class="training-list">
                    <div class="training-item"><div class="dot">1</div><div class="item-text">只承诺开始，不要求完成全部。</div></div>
                    <div class="training-item"><div class="dot">2</div><div class="item-text">观察不舒服，但不马上逃离。</div></div>
                    <div class="training-item"><div class="dot">3</div><div class="item-text">逐步延长行动时间。</div></div>
                </div>
            </div>
        </div>
        <div class="page-footer"><div class="footer-left">怎么解决拖延症 · 行动先于完美</div><div class="footer-right">05 / 10</div></div>
    </div>
</body>
</html>
