<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>环境优化：减少干扰，增加约束</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial, SimHei; overflow: hidden; }
        .slide { width: 1280px; height: 720px; display: flex; flex-direction: column; }
        .page-header { height: 80px; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #A61B29; background: #FFFFFF; }
        .page-title { font-size: 28px; color: #7A1E1E; font-weight: 700; }
        .section-info { font-size: 16px; color: #8C7A66; white-space: nowrap; }
        .page-body { flex: 1; height: 590px; padding: 36px 60px; background: linear-gradient(180deg, #F8F1E3 0%, #FFFFFF 100%); display: flex; align-items: center; gap: 30px; }
        .strategy-card { width: 500px; height: 460px; background: #FFFFFF; border: 1px solid #E8D8BF; border-radius: 18px; overflow: hidden; }
        .card-label { height: 70px; display: flex; align-items: center; padding: 0 28px; color: #FFFFFF; font-size: 26px; font-weight: 700; }
        .label-blue { background: #A61B29; }
        .label-green { background: #D4AF37; }
        .card-content { padding: 30px 28px; }
        .action-item { display: flex; align-items: center; height: 72px; border-bottom: 1px solid #E8D8BF; }
        .action-item:last-child { border-bottom: 0; }
        .check-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #FFFFFF; font-size: 17px; font-weight: 700; margin-right: 16px; flex-shrink: 0; }
        .dot-blue { background: #A61B29; }
        .dot-green { background: #D4AF37; }
        .action-text { font-size: 21px; font-weight: 600; color: #7A1E1E; white-space: nowrap; }
        .card-note { margin-top: 24px; padding: 18px; border-radius: 14px; background: #F8F1E3; color: #6B4F3A; font-size: 16px; line-height: 1.7; }
        .center-compare { width: 100px; height: 460px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .compare-icon { width: 72px; height: 72px; border-radius: 50%; border: 3px solid #C87941; display: flex; align-items: center; justify-content: center; color: #C87941; font-size: 34px; font-weight: 700; margin-bottom: 18px; }
        .compare-text { font-size: 18px; color: #7A1E1E; font-weight: 700; text-align: center; line-height: 1.5; }
        .page-footer { height: 50px; padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E8D8BF; background: #FFFFFF; }
        .footer-left, .footer-right { font-size: 14px; color: #8C7A66; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="page-header"><div class="page-title">环境优化：减少干扰，增加约束</div><div class="section-info">05 / 执行策略</div></div>
        <div class="page-body">
            <div class="strategy-card">
                <div class="card-label label-blue">减少干扰</div>
                <div class="card-content">
                    <div class="action-item"><div class="check-dot dot-blue">1</div><div class="action-text">关闭手机通知</div></div>
                    <div class="action-item"><div class="check-dot dot-blue">2</div><div class="action-text">使用专注 APP</div></div>
                    <div class="action-item"><div class="check-dot dot-blue">3</div><div class="action-text">物理隔离干扰源</div></div>
                    <div class="card-note">降低外部刺激，减少前额叶皮层的控制负担。</div>
                </div>
            </div>
            <div class="center-compare"><div class="compare-icon">&gt;</div><div class="compare-text">环境设计<br>优于<br>意志力硬扛</div></div>
            <div class="strategy-card">
                <div class="card-label label-green">利用外部约束</div>
                <div class="card-content">
                    <div class="action-item"><div class="check-dot dot-green">1</div><div class="action-text">公开承诺截止日期</div></div>
                    <div class="action-item"><div class="check-dot dot-green">2</div><div class="action-text">向朋友汇报进度</div></div>
                    <div class="action-item"><div class="check-dot dot-green">3</div><div class="action-text">与他人组队监督</div></div>
                    <div class="card-note">通过社交压力增强执行力，让开始和坚持更容易发生。</div>
                </div>
            </div>
        </div>
        <div class="page-footer"><div class="footer-left">怎么解决拖延症 · 行动先于完美</div><div class="footer-right">07 / 10</div></div>
    </div>
</body>
</html>
