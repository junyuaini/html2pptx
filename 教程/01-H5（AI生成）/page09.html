<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>长期调整：重建掌控感</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial, SimHei; overflow: hidden; }
        .slide { width: 1280px; height: 720px; display: flex; flex-direction: column; }
        .page-header { height: 80px; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #A61B29; background: #FFFFFF; }
        .page-title { font-size: 28px; color: #7A1E1E; font-weight: 700; }
        .section-info { font-size: 16px; color: #8C7A66; white-space: nowrap; }
        .page-body { flex: 1; height: 590px; padding: 36px 60px; background: linear-gradient(180deg, #F8F1E3 0%, #FFFFFF 100%); }
        .content { display: flex; gap: 34px; height: 430px; }
        .stair-panel { width: 560px; background: #FFFFFF; border: 1px solid #E8D8BF; border-radius: 18px; padding: 30px; }
        .panel-title { font-size: 24px; font-weight: 700; color: #7A1E1E; margin-bottom: 24px; }
        .stairs { position: relative; height: 315px; }
        .stair { position: absolute; height: 64px; border-radius: 14px; display: flex; align-items: center; padding: 0 24px; color: #FFFFFF; }
        .stair-1 { left: 0; bottom: 0; width: 250px; background: #A61B29; }
        .stair-2 { left: 80px; bottom: 78px; width: 290px; background: #D4AF37; }
        .stair-3 { left: 160px; bottom: 156px; width: 330px; background: #C87941; }
        .stair-4 { left: 240px; bottom: 234px; width: 270px; background: #2E5E4E; }
        .stair-main { font-size: 20px; font-weight: 700; margin-right: 14px; white-space: nowrap; }
        .stair-desc { font-size: 13px; line-height: 1.4; }
        .record-panel { flex: 1; background: #FFFFFF; border: 1px solid #E8D8BF; border-radius: 18px; padding: 30px; }
        .record-card { background: #FFF8E7; border: 1px solid rgba(242,153,74,0.45); border-radius: 16px; padding: 24px; height: 315px; }
        .record-title { font-size: 24px; color: #7A1E1E; font-weight: 700; margin-bottom: 22px; }
        .record-line { height: 52px; border-bottom: 1px solid #E8D8BF; display: flex; align-items: center; font-size: 17px; color: #6B4F3A; }
        .record-num { width: 30px; height: 30px; border-radius: 50%; background: #C87941; color: #FFFFFF; display: flex; justify-content: center; align-items: center; font-size: 15px; font-weight: 700; margin-right: 12px; flex-shrink: 0; }
        .record-tip { margin-top: 22px; font-size: 16px; color: #7A1E1E; line-height: 1.6; }
        .warning { height: 72px; margin-top: 24px; border-radius: 16px; border: 1px solid rgba(242,153,74,0.55); background: rgba(242,153,74,0.12); display: flex; align-items: center; padding: 0 28px; color: #7A1E1E; font-size: 19px; font-weight: 600; }
        .warning-badge { width: 34px; height: 34px; border-radius: 50%; background: #C87941; color: #FFFFFF; display: flex; justify-content: center; align-items: center; font-weight: 700; margin-right: 14px; flex-shrink: 0; }
        .page-footer { height: 50px; padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E8D8BF; background: #FFFFFF; }
        .footer-left, .footer-right { font-size: 14px; color: #8C7A66; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="page-header"><div class="page-title">长期调整：重建掌控感</div><div class="section-info">07 / 自我效能感</div></div>
        <div class="page-body">
            <div class="content">
                <div class="stair-panel">
                    <div class="panel-title">从微小行动到掌控感重建</div>
                    <div class="stairs">
                        <div class="stair stair-1"><span class="stair-main">微小行动</span><span class="stair-desc">先让开始发生</span></div>
                        <div class="stair stair-2"><span class="stair-main">完成记录</span><span class="stair-desc">留下成功证据</span></div>
                        <div class="stair stair-3"><span class="stair-main">自信增强</span><span class="stair-desc">相信自己能做到</span></div>
                        <div class="stair stair-4"><span class="stair-main">掌控感重建</span><span class="stair-desc">形成正向循环</span></div>
                    </div>
                </div>
                <div class="record-panel">
                    <div class="record-card">
                        <div class="record-title">每天记录 3 件已完成的事</div>
                        <div class="record-line"><div class="record-num">1</div><div>今天开始了一个小任务</div></div>
                        <div class="record-line"><div class="record-num">2</div><div>完成了一个 2 分钟行动</div></div>
                        <div class="record-line"><div class="record-num">3</div><div>坚持了 5 分钟专注</div></div>
                        <div class="record-tip">记录成功经验，是强化自信的证据。</div>
                    </div>
                </div>
            </div>
            <div class="warning"><div class="warning-badge">!</div><div>如果拖延伴随严重焦虑或抑郁，建议咨询心理医生。</div></div>
        </div>
        <div class="page-footer"><div class="footer-left">怎么解决拖延症 · 行动先于完美</div><div class="footer-right">09 / 10</div></div>
    </div>
</body>
</html>
