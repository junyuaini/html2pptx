<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>怎么解决拖延症</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            font-family: "Microsoft YaHei", Arial, SimHei;
            overflow: hidden;
        }
        .slide {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #7A1E1E 0%, #A61B29 52%, #D4AF37 100%);
            position: relative;
        }
        .date-tag {
            position: absolute;
            top: 40px;
            left: 60px;
            font-size: 14px;
            color: #FFFFFF;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 20px;
            padding: 6px 18px;
            white-space: nowrap;
        }
        .main-content {
            position: absolute;
            left: 60px;
            top: 200px;
        }
        .main-title {
            font-size: 72px;
            font-weight: 700;
            color: #FFFFFF;
            margin-bottom: 24px;
            letter-spacing: 4px;
        }
        .subtitle {
            font-size: 30px;
            font-weight: 400;
            color: rgba(255,255,255,0.88);
            margin-bottom: 20px;
        }
        .slogan {
            font-size: 20px;
            font-weight: 400;
            color: rgba(255,255,255,0.78);
            margin-top: 16px;
        }
        .deco-area {
            position: absolute;
            right: 60px;
            top: 120px;
            width: 380px;
            height: 480px;
        }
        .circle-1 {
            position: absolute;
            right: 40px;
            top: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .circle-2 {
            position: absolute;
            right: 120px;
            top: 100px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.2);
        }
        .circle-3 {
            position: absolute;
            right: 20px;
            top: 220px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.25);
        }
        .start-card {
            position: absolute;
            right: 30px;
            top: 340px;
            width: 260px;
            height: 100px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .start-text {
            font-size: 36px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 6px;
        }
        .footer-text {
            position: absolute;
            bottom: 30px;
            right: 60px;
            font-size: 16px;
            color: rgba(255,255,255,0.72);
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="date-tag">20260609 · 自我管理主题</div>
        <div class="main-content">
            <div class="main-title">怎么解决拖延症</div>
            <div class="subtitle">从认知、情绪到行动的系统改善方案</div>
            <div class="slogan">行动先于完美，每一次微小开始都在重建掌控感</div>
        </div>
        <div class="deco-area">
            <div class="circle-1"></div>
            <div class="circle-2"></div>
            <div class="circle-3"></div>
            <div class="start-card">
                <span class="start-text">3 · 2 · 1 START</span>
            </div>
        </div>
        <div class="footer-text">H5版本PPT设计文档</div>
    </div>
</body>
</html>
