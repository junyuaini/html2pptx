<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>总结：行动先于完美</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            font-family: "Microsoft YaHei", Arial, SimHei;
            overflow: hidden;
        }
        .slide {
            width: 1280px;
            height: 720px;
            background: linear-gradient(135deg, #7A1E1E 0%, #A61B29 48%, #D4AF37 100%);
            position: relative;
            color: #FFFFFF;
        }
        .main-title {
            position: absolute;
            top: 120px;
            left: 0;
            width: 1280px;
            text-align: center;
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .subtitle {
            position: absolute;
            top: 225px;
            left: 0;
            width: 1280px;
            text-align: center;
            font-size: 28px;
            color: rgba(255,255,255,0.86);
        }
        .summary-cards {
            position: absolute;
            top: 320px;
            left: 120px;
            width: 1040px;
            display: flex;
            gap: 28px;
        }
        .summary-card {
            flex: 1;
            height: 150px;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 18px;
            padding: 26px 24px;
            text-align: center;
        }
        .card-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            white-space: nowrap;
        }
        .card-desc {
            font-size: 17px;
            line-height: 1.6;
            color: rgba(255,255,255,0.84);
        }
        .action-tip {
            position: absolute;
            left: 290px;
            bottom: 105px;
            width: 700px;
            height: 64px;
            border-radius: 32px;
            background: #C87941;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            white-space: nowrap;
        }
        .thanks {
            position: absolute;
            right: 60px;
            bottom: 36px;
            font-size: 18px;
            color: rgba(255,255,255,0.72);
        }
        .deco-circle-1 {
            position: absolute;
            left: 60px;
            top: 70px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.18);
        }
        .deco-circle-2 {
            position: absolute;
            right: 80px;
            top: 85px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.22);
        }
        .deco-line {
            position: absolute;
            top: 286px;
            left: 540px;
            width: 200px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="deco-circle-1"></div>
        <div class="deco-circle-2"></div>
        <div class="main-title">行动先于完美</div>
        <div class="subtitle">每一次微小行动，都是对拖延习惯的瓦解</div>
        <div class="deco-line"></div>
        <div class="summary-cards">
            <div class="summary-card">
                <div class="card-title">先接纳</div>
                <div class="card-desc">减少自责<br>停止焦虑循环</div>
            </div>
            <div class="summary-card">
                <div class="card-title">再启动</div>
                <div class="card-desc">3秒倒计时<br>完成最小动作</div>
            </div>
            <div class="summary-card">
                <div class="card-title">后坚持</div>
                <div class="card-desc">记录成功<br>重建掌控感</div>
            </div>
        </div>
        <div class="action-tip">现在就选择一个 2 分钟内能完成的小动作。</div>
        <div class="thanks">感谢观看</div>
    </div>
</body>
</html>
