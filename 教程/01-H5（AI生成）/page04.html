<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>认知重塑：先完成再改进</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1280px; height: 720px; font-family: "Microsoft YaHei", Arial, SimHei; overflow: hidden; }
        .slide { width: 1280px; height: 720px; display: flex; flex-direction: column; }
        .page-header { height: 80px; padding: 20px 60px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #A61B29; background: #FFFFFF; }
        .page-title { font-size: 28px; color: #7A1E1E; font-weight: 700; }
        .section-info { font-size: 16px; color: #8C7A66; white-space: nowrap; }
        .page-body { flex: 1; height: 590px; padding: 36px 60px; background: linear-gradient(180deg, #F8F1E3 0%, #FFFFFF 100%); }
        .principle-banner { height: 90px; background: linear-gradient(90deg, #A61B29 0%, #D4AF37 100%); border-radius: 16px; display: flex; align-items: center; padding: 0 36px; margin-bottom: 30px; }
        .principle-text { font-size: 30px; font-weight: 700; color: #FFFFFF; }
        .cards { display: flex; gap: 30px; height: 375px; }
        .card { flex: 1; background: #FFFFFF; border: 1px solid #E8D8BF; border-radius: 16px; padding: 28px; position: relative; }
        .card-head { display: flex; align-items: center; margin-bottom: 22px; }
        .badge { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #A61B29, #D4AF37); display: flex; justify-content: center; align-items: center; color: #FFFFFF; font-size: 18px; font-weight: 700; margin-right: 16px; }
        .card-title { font-size: 24px; font-weight: 700; color: #7A1E1E; white-space: nowrap; }
        .desc { font-size: 17px; color: #2B2B2B; line-height: 1.7; margin-bottom: 18px; }
        .compare { display: flex; align-items: center; gap: 14px; margin-top: 22px; }
        .compare-box { flex: 1; border: 1px solid #E8D8BF; border-radius: 12px; padding: 16px; background: #FFF8E7; }
        .compare-label { font-size: 13px; color: #8C7A66; margin-bottom: 8px; white-space: nowrap; }
        .compare-text { font-size: 18px; font-weight: 700; color: #7A1E1E; }
        .arrow { font-size: 28px; color: #D4AF37; font-weight: 700; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
        .chip { padding: 8px 14px; border-radius: 18px; background: #F7E8D0; color: #A61B29; font-size: 14px; font-weight: 600; white-space: nowrap; }
        .method-note { position: absolute; left: 28px; right: 28px; bottom: 24px; padding: 12px 16px; border-radius: 12px; background: rgba(59,191,167,0.12); color: #7A1E1E; font-size: 15px; line-height: 1.5; }
        .page-footer { height: 50px; padding: 15px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E8D8BF; background: #FFFFFF; }
        .footer-left, .footer-right { font-size: 14px; color: #8C7A66; }
    </style>
</head>
<body>
    <div class="slide">
        <div class="page-header"><div class="page-title">认知重塑：先完成再改进</div><div class="section-info">02 / 改变思维模式</div></div>
        <div class="page-body">
            <div class="principle-banner"><div class="principle-text">用“我现在可以开始”替代“我为什么又拖延”</div></div>
            <div class="cards">
                <div class="card">
                    <div class="card-head"><div class="badge">01</div><div class="card-title">接纳与自我和解</div></div>
                    <div class="desc">减少自我批判，接纳当下状态，避免焦虑循环继续扩大。</div>
                    <div class="compare">
                        <div class="compare-box"><div class="compare-label">修改前</div><div class="compare-text">我必须完美完成</div></div>
                        <div class="arrow">→</div>
                        <div class="compare-box"><div class="compare-label">修改后</div><div class="compare-text">先完成再改进</div></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-head"><div class="badge">02</div><div class="card-title">拆解任务，降低启动门槛</div></div>
                    <div class="desc">把庞大任务拆成 2 分钟内可完成的小步骤，让大脑更容易开始。</div>
                    <div class="chips"><span class="chip">查3篇资料</span><span class="chip">列一个提纲</span><span class="chip">打开文档</span><span class="chip">写第一句</span></div>
                    <div class="method-note">瑞士奶酪法：用零碎时间打孔式推进任务。</div>
                </div>
            </div>
        </div>
        <div class="page-footer"><div class="footer-left">怎么解决拖延症 · 行动先于完美</div><div class="footer-right">04 / 10</div></div>
    </div>
</body>
</html>
